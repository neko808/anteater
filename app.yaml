runtime: nodejs8

handlers: 
  - url: /
    static_files: index.html
    upload: index\.html
    secure: always

  - url: /pricing.html
    static_files: pricing.html
    upload: pricing.html
    secure: always

  - url: /ecommerce-search.html
    static_files: ecommerce-search.html
    upload: ecommerce-search.html
    secure: always

  - url: /gsa-migration.html
    static_files: gsa-migration.html
    upload: gsa-migration.html
    secure: always

  - url: /index-recognition.html
    static_files: index-recognition.html
    upload: index-recognition.html
    secure: always

  - url: /web-search.html
    static_files: web-search.html
    upload: web-search.html
    secure: always
  
  - url: /data.json
    static_files: data.json
    upload: data.json
    secure: always
  
  - url: /img/
    static_dir: img
    secure: always
  
  - url: /css/
    static_dir: css
    secure: always
  
  - url: /fotos/
    static_dir: fotos
    secure: always
  
  - url: /js/
    static_dir: js
    secure: always
  
  - url: /xjs/
    static_dir: xjs
    secure: always